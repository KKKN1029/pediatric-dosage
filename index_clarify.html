<script>
// ============================================================
// バージョン管理 / cache busting
// リリース時に BUILD_VERSION を 1 つ上げるだけで、PWA・SW・CDN の
// 古いキャッシュをユーザー操作なしで強制更新する。
//   1. HTML 自体: meta cache-control + raw.githack の no-cache でブラウザに保留させない
//   2. Service Worker: ?v=NN 付きで登録 → activate 時に他バージョン cache を全削除
//   3. ローカル: 起動時に localStorage の version と比較し、不一致なら旧 SW を解除して
//      1度だけリロードして新コードを確実に読み込む
// ============================================================
const BUILD_VERSION = '104'
;(async () => {
  if (!('serviceWorker' in navigator)) return
  const stored = localStorage.getItem('app_build_version')
  // 旧バージョン検出: 全 SW を unregister + 全 cache を削除して 1 度だけリロード
  if (stored && stored !== BUILD_VERSION) {
    try {
      const regs = await navigator.serviceWorker.getRegistrations()
      await Promise.all(regs.map(r => r.unregister()))
    } catch {}
    try {
      if ('caches' in window) {
        const keys = await caches.keys()
        await Promise.all(keys.map(k => caches.delete(k)))
      }
    } catch {}
    localStorage.setItem('app_build_version', BUILD_VERSION)
    if (!sessionStorage.getItem('reloaded_' + BUILD_VERSION)) {
      sessionStorage.setItem('reloaded_' + BUILD_VERSION, '1')
      location.reload()
      return
    }
  }
  localStorage.setItem('app_build_version', BUILD_VERSION)
  // バージョン付き URL で SW 登録 (バージョン変更時はブラウザが SW 自体を更新)
  navigator.serviceWorker.register('sw.js?v=' + BUILD_VERSION).catch(() => {})
})()
</script>

// ============================================================
// 埋め込みデータのスナップショット
//   Gist によって DRUGS / DISEASES が上書きされる前の埋め込み値を保持。
//   Gist 側で ivDilution など特定フィールドが欠落している場合に、
//   この埋め込みから id 単位でフォールバック補完する。
// ============================================================
const EMBEDDED_DRUGS_BY_ID = new Map(DRUGS.map(d => [d.id, d]))
// 埋め込み疾患も Gist に無い場合はマージして常に表示するためのスナップショット
const EMBEDDED_DISEASES_BY_ID = new Map(DISEASES.map(d => [d.id, d]))
const EMBEDDED_DISEASE_CATEGORIES = Array.isArray(DISEASE_CATEGORIES) ? [...DISEASE_CATEGORIES] : []
// 各薬剤カテゴリ内のサブカテゴリ並び順 (Gist 由来。data.subcategoryOrder で差し替える)
let SUBCATEGORY_ORDER = {}
// サブサブカテゴリ並び順: { [カテゴリ]: { [サブカテゴリ]: [サブサブ1, サブサブ2, ...] } }
let SUBSUBCATEGORY_ORDER = {}

// ============================================================
// データアクセス (localStorage)
// ============================================================

const LS = {
  get: (k, d='{}') => { try { return JSON.parse(localStorage.getItem(k) || d) } catch { return JSON.parse(d) } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
  del: k => localStorage.removeItem(k),
}

// ============================================================
// マスターデータ同期 (Gist)
//   URL に ?gist=ID があれば優先して保存。
//   localStorage キャッシュを即時適用 → リモート再取得で上書き。
//   失敗時は組込みデータ (DRUGS / DISEASES / IV_FLUID_TABLES) で動作継続。
// ============================================================
const GIST_FILENAME = 'pediatric-dosage-data.json'
const GIST_LS_ID = 'master_gist_id'
const GIST_LS_CACHE = 'master_gist_cache'
const GIST_LS_CACHE_AT = 'master_gist_cache_at'

function getGistId() {
  try {
    const u = new URL(location.href)
    const fromUrl = u.searchParams.get('gist')
    if (fromUrl) {
      const id = extractGistId(fromUrl)
      localStorage.setItem(GIST_LS_ID, id)
      return id
    }
  } catch {}
  return localStorage.getItem(GIST_LS_ID) || ''
}
function setGistId(id) {
  if (!id) localStorage.removeItem(GIST_LS_ID)
  else localStorage.setItem(GIST_LS_ID, extractGistId(id))
}

function applyMasterData(data) {
  if (!data || typeof data !== 'object') return false
  // Gist や cache 経由で薬剤データが更新された場合、変更された薬剤のダブルチェックを解除する
  // 比較の基準は前回 applyMasterData した時のスナップショット (master_drugs_applied)
  if (Array.isArray(data.drugs)) {
    // Gist 値を優先しつつ、ivDilution / formulations が Gist 側に欠落していれば
    // 埋め込み (EMBEDDED_DRUGS_BY_ID) からフォールバック補完する。
    const merged = data.drugs.map(d => {
      const emb = EMBEDDED_DRUGS_BY_ID.get(d.id)
      if (!emb) return d
      // preferEmbedded:true の薬剤は常に埋め込み版を優先 (構造化データや pending の整合性維持)
      if (emb.preferEmbedded) return emb
      const m = {...d}
      if (!m.ivDilution && emb.ivDilution) m.ivDilution = emb.ivDilution
      if ((!Array.isArray(m.formulations) || m.formulations.length === 0) && Array.isArray(emb.formulations) && emb.formulations.length) {
        m.formulations = emb.formulations
      }
      return m
    })
    // 埋め込みに存在するが Gist に無い薬剤は末尾に追加 (常に見えるように)
    //   Gist 保存前でも新規追加分をアプリで即時利用できる、
    //   同時に __syncEmbeddedAdditions__ で編集ツールなしでも Gist へ push する。
    const gistIds = new Set(merged.map(x => x.id))
    const embOnly = [...EMBEDDED_DRUGS_BY_ID.values()].filter(x => x && x.id && !gistIds.has(x.id))
    DRUGS = embOnly.length ? [...merged, ...embOnly] : merged
    try { localStorage.setItem('master_drugs_applied', JSON.stringify(DRUGS)) } catch {}
    // v57 削除: 差分検出による自動リセットは廃止
    //   ・編集ツールでチェックを付けるたびに Gist 上の drug データも変わり、
    //     その差分でチェックが解除されるという誤動作を引き起こしていた
    //   ・代わりに編集ツールが check1/check2 を Gist に同期するため、
    //     データの正本は Gist 側で一貫管理される
  }
  // Gist に check1 / check2 が同梱されていれば localStorage に反映 (Gist が正本)
  if (Array.isArray(data.check1)) LS.set('check1', data.check1)
  if (Array.isArray(data.check2)) LS.set('check2', data.check2)
  // サブカテゴリ並び順 (カテゴリ→[サブ1,サブ2,...] のオブジェクト)
  if (data.subcategoryOrder && typeof data.subcategoryOrder === 'object') {
    SUBCATEGORY_ORDER = data.subcategoryOrder
  }
  // サブサブカテゴリ並び順
  if (data.subsubcategoryOrder && typeof data.subsubcategoryOrder === 'object') {
    SUBSUBCATEGORY_ORDER = data.subsubcategoryOrder
  }
  if (Array.isArray(data.diseases)) {
    const gistDiseaseIds = new Set(data.diseases.map(x => x && x.id).filter(Boolean))
    // preferEmbedded:true の疾患は Gist の同 id 版を埋め込み版で置き換える
    //   (code 管理の構造化データが Gist 上の古い版で上書きされないようにする)
    const preferEmbedMap = new Map([...EMBEDDED_DISEASES_BY_ID.entries()].filter(([, d]) => d && d.preferEmbedded))
    const mergedGist = data.diseases.map(d => (d && preferEmbedMap.get(d.id)) || d)
    // Gist に無い埋め込み疾患は末尾に追加
    const embOnlyDiseases = [...EMBEDDED_DISEASES_BY_ID.values()].filter(x => x && x.id && !gistDiseaseIds.has(x.id))
    DISEASES = embOnlyDiseases.length ? [...mergedGist, ...embOnlyDiseases] : mergedGist
  }
  if (Array.isArray(data.ivFluidTables)) IV_FLUID_TABLES = data.ivFluidTables
  if (Array.isArray(data.drugCategories) && data.drugCategories.length) CATEGORIES = data.drugCategories
  if (Array.isArray(data.diseaseCategories) && data.diseaseCategories.length) {
    // 疾患カテゴリも埋め込み分をマージ (Gist に無いカテゴリは追加)
    const merged = [...data.diseaseCategories]
    for (const c of EMBEDDED_DISEASE_CATEGORIES) {
      if (c && !merged.includes(c)) merged.push(c)
    }
    DISEASE_CATEGORIES = merged
  }
  // ステロイド外用薬データ (Gist 経由の同期)
  if (typeof STEROID_RANKS !== 'undefined') {
    if (Array.isArray(data.steroidRanks))      STEROID_RANKS = data.steroidRanks
    if (Array.isArray(data.steroidSeverity))   STEROID_SEVERITY = data.steroidSeverity
    if (Array.isArray(data.steroidNonsteroid)) STEROID_NONSTEROID_REFS = data.steroidNonsteroid
  }
  return true
}

// 入力された文字列から Gist ID を抽出する。
//   - 32桁/40桁の hex そのもの → そのまま返す
//   - https://gist.github.com/USER/ABC123 形式 → 末尾の hex を返す
//   - https://gist.github.com/ABC123 形式 → ABC123 を返す
//   - https://gist.githubusercontent.com/USER/ABC123/raw/... → ABC123 を返す
function extractGistId(input) {
  if (!input) return ''
  const s = String(input).trim()
  // 既に hex のみ
  if (/^[a-f0-9]{20,40}$/i.test(s)) return s
  // URL から最後の hex 部分を抽出
  const m = s.match(/([a-f0-9]{20,40})/i)
  return m ? m[1] : s
}

// Gist 取得は 2 段構え:
//   1) gist.github.com/{ID}.json で owner と filename を取得 (公開Webページ扱いで rate limit / CORS 制限が緩い)
//   2) gist.githubusercontent.com/{owner}/{ID}/raw/{filename} で実データを取得 (静的ファイル配信で確実)
// API (api.github.com) は iPhone Safari + プライベートリレー / 共有 IP で 404 になる事例があるため
// fallback としてのみ使用する。
async function fetchGistMaster(id) {
  let primaryError = null
  // --- Strategy 0: localhost 経由なら serve.py の /proxy/gist/{id} を優先 ---
  //   Claude Preview 等の in-app browser では外部 fetch がブロックされるため、
  //   同一オリジンの serve.py にプロキシさせて Gist を取得する。
  //   serve.py が旧版でプロキシ未対応の場合は 404 になり、下の直接 fetch に fallback。
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '[::1]') {
    try {
      const proxyRes = await fetch(`/proxy/gist/${encodeURIComponent(id)}`, { cache: 'no-cache' })
      if (proxyRes.ok) {
        const data = await proxyRes.json()
        return data
      }
      primaryError = `proxy HTTP ${proxyRes.status}`
      console.warn('[Gist proxy 経由 失敗]', primaryError, '→ 直接fetch にフォールバック')
    } catch (e) {
      primaryError = 'proxy: ' + e.message
      console.warn('[Gist proxy 経由 例外]', e.message, '→ 直接fetch にフォールバック')
    }
  }
  // --- Strategy A: メタJSON + raw (推奨) ---
  try {
    const metaRes = await fetch(`https://gist.github.com/${id}.json`, { cache: 'no-cache' })
    if (!metaRes.ok) throw new Error(`metadata HTTP ${metaRes.status}`)
    const meta = await metaRes.json()
    const owner = meta.owner
    const files = Array.isArray(meta.files) ? meta.files : []
    const filename = files.find(f => f === GIST_FILENAME) || files[0]
    if (!owner) throw new Error('owner 不明')
    if (!filename) throw new Error('ファイル一覧が空')
    const rawUrl = `https://gist.githubusercontent.com/${owner}/${id}/raw/${filename}`
    const rawRes = await fetch(rawUrl, { cache: 'no-cache' })
    if (!rawRes.ok) throw new Error(`raw HTTP ${rawRes.status}`)
    const text = await rawRes.text()
    return JSON.parse(text)
  } catch (e) {
    primaryError = e.message
    console.warn('[Gist raw 経由 失敗]', primaryError)
  }
  // --- Strategy B: API (fallback) ---
  try {
    const url = `https://api.github.com/gists/${id}`
    const token = localStorage.getItem('editor_gh_token') || ''
    const headers = { 'Accept': 'application/vnd.github+json' }
    if (token) headers['Authorization'] = 'Bearer ' + token
    const res = await fetch(url, { headers })
    if (!res.ok) {
      let detail = ''
      try { const j = await res.json(); if (j && j.message) detail = ' / ' + j.message } catch {}
      throw new Error(`API HTTP ${res.status}${detail}`)
    }
    const gist = await res.json()
    const file = gist.files[GIST_FILENAME] || Object.values(gist.files)[0]
    if (!file) throw new Error(`Gist 内に ${GIST_FILENAME} がありません (含まれるファイル: ${Object.keys(gist.files).join(', ') || 'なし'})`)
    const content = file.truncated ? await fetch(file.raw_url).then(r => r.text()) : file.content
    return JSON.parse(content)
  } catch (e) {
    throw new Error(`Gist 取得失敗\n  raw経由: ${primaryError}\n  API経由: ${e.message}`)
  }
}

// 起動時の同期: キャッシュ即時適用 → リモート fetch (バックグラウンド)
function applyCachedMasterIfAny() {
  const id = getGistId()
  if (!id) return false
  const cached = LS.get(GIST_LS_CACHE, 'null')
  return cached ? applyMasterData(cached) : false
}

// 直近の同期エラー (openMasterGistDialog でユーザーに見せるため)
let __lastGistError = ''
async function refreshMasterFromGist() {
  const id = getGistId()
  if (!id) return false
  try {
    const data = await fetchGistMaster(id)
    const changed = applyMasterData(data)
    LS.set(GIST_LS_CACHE, data)
    localStorage.setItem(GIST_LS_CACHE_AT, String(Date.now()))
    __lastGistError = ''
    // 埋め込みで追加された内容 (drugs / drugCategories) を Gist に自動同期
    //   token (editor_gh_token) が設定されている端末で初回のみ実行される
    autoSyncEmbeddedAdditions(id, data).catch(e => console.warn('[auto-sync]', e?.message || e))
    return changed
  } catch (e) {
    __lastGistError = e.message
    console.warn('[Gist 同期失敗]', e.message)
    return false
  }
}

// ============================================================
// 埋め込み → Gist 自動同期
//   ・埋め込み HTML に追加した薬剤/カテゴリを、Gist に無ければ自動的に PATCH
//   ・PAT (editor_gh_token) が設定された端末でのみ動作
//   ・保存後、次のセッションからは Gist 側にも入るのでリロードで正常表示
// ============================================================
let __autoSyncRunning = false
async function autoSyncEmbeddedAdditions(gistId, gistData) {
  if (__autoSyncRunning) return
  if (!gistId || !gistData) return
  let tokenRaw = localStorage.getItem('editor_gh_token')
  if (!tokenRaw) return
  let token
  try { token = JSON.parse(tokenRaw) } catch { token = tokenRaw }
  if (!token || typeof token !== 'string') return

  // 差分検出 (薬剤 / 薬剤カテゴリ / 疾患 / 疾患カテゴリ)
  const gistDrugIds = new Set((gistData.drugs || []).map(x => x && x.id).filter(Boolean))
  const newDrugs = [...EMBEDDED_DRUGS_BY_ID.entries()]
    .filter(([id]) => !gistDrugIds.has(id))
    .map(([, emb]) => emb)
  const gistCatSet = new Set(gistData.drugCategories || [])
  const embCats = new Set(CATEGORIES || [])
  newDrugs.forEach(d => { if (d && d.category) embCats.add(d.category) })
  const newCats = [...embCats].filter(c => c && !gistCatSet.has(c))

  const gistDiseaseIds = new Set((gistData.diseases || []).map(x => x && x.id).filter(Boolean))
  const newDiseases = [...EMBEDDED_DISEASES_BY_ID.entries()]
    .filter(([id]) => !gistDiseaseIds.has(id))
    .map(([, emb]) => emb)
  const gistDiseaseCatSet = new Set(gistData.diseaseCategories || [])
  const newDiseaseCats = EMBEDDED_DISEASE_CATEGORIES.filter(c => c && !gistDiseaseCatSet.has(c))

  if (newDrugs.length === 0 && newCats.length === 0 && newDiseases.length === 0 && newDiseaseCats.length === 0) return

  __autoSyncRunning = true
  try {
    const nextData = {...gistData}
    nextData.drugs = [...(gistData.drugs || []), ...newDrugs]
    nextData.drugCategories = [...(gistData.drugCategories || []), ...newCats]
    if (newDiseases.length) nextData.diseases = [...(gistData.diseases || []), ...newDiseases]
    if (newDiseaseCats.length) nextData.diseaseCategories = [...(gistData.diseaseCategories || []), ...newDiseaseCats]
    nextData.updatedAt = new Date().toISOString()

    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: 'PATCH',
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        files: { [GIST_FILENAME]: { content: JSON.stringify(nextData, null, 2) } }
      })
    })
    if (!res.ok) {
      console.warn('[Gist auto-sync 失敗]', res.status)
      return
    }
    // キャッシュも更新
    LS.set(GIST_LS_CACHE, nextData)
    localStorage.setItem(GIST_LS_CACHE_AT, String(Date.now()))
    // トースト通知
    try {
      const msg = document.createElement('div')
      msg.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#0369a1;color:white;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99999;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:320px;line-height:1.4'
      const parts = [`薬剤+${newDrugs.length}`, `カテゴリ+${newCats.length}`]
      if (newDiseases.length) parts.push(`疾患+${newDiseases.length}`)
      if (newDiseaseCats.length) parts.push(`疾患カテゴリ+${newDiseaseCats.length}`)
      msg.textContent = `📦 Gist に同期しました: ${parts.join(' / ')}`
      document.body.appendChild(msg)
      setTimeout(() => { msg.style.opacity = '0'; msg.style.transition = 'opacity .3s' }, 3500)
      setTimeout(() => msg.remove(), 4000)
    } catch {}
    console.log(`[Gist auto-sync] +${newDrugs.length} 薬剤 / +${newCats.length} カテゴリ / +${newDiseases.length} 疾患 / +${newDiseaseCats.length} 疾患カテゴリ`)
  } catch (e) {
    console.warn('[Gist auto-sync 例外]', e.message)
  } finally {
    __autoSyncRunning = false
  }
}

// マスターデータ同期の設定ダイアログ (sidebar の ⚙ ボタンから開く)
async function openMasterGistDialog() {
  const current = getGistId()
  const cachedAt = localStorage.getItem(GIST_LS_CACHE_AT)
  const cachedAtStr = cachedAt ? new Date(+cachedAt).toLocaleString('ja-JP') : '(未同期)'
  const status = current
    ? `現在の Gist ID: ${current}\n最終同期: ${cachedAtStr}\n\n変更しない場合はそのまま OK を、解除する場合は空欄にしてください。`
    : 'マスターデータの Gist ID を入力してください。\n空欄のままなら組込みデータを使用します。'
  const next = prompt(status + '\n\nGist ID:', current)
  if (next === null) return // キャンセル
  const trimmed = next.trim()
  if (trimmed === current) return
  if (!trimmed) {
    if (!confirm('Gist 連携を解除します。組込みデータのみを使用するようになります。よろしいですか？')) return
    setGistId('')
    localStorage.removeItem(GIST_LS_CACHE)
    localStorage.removeItem(GIST_LS_CACHE_AT)
    alert('解除しました。ページを再読込します。')
    location.reload()
    return
  }
  const cleanId = extractGistId(trimmed)
  setGistId(cleanId)
  localStorage.removeItem(GIST_LS_CACHE)
  localStorage.removeItem(GIST_LS_CACHE_AT)
  const ok = await refreshMasterFromGist()
  if (ok) { alert('Gist からマスターデータを取得しました。ページを再読込します。'); location.reload() }
  else {
    alert('Gist の取得に失敗しました。\n\n入力された ID: ' + cleanId + '\n\nエラー詳細:\n' + (__lastGistError || '不明なエラー') + '\n\n確認事項:\n• Gist ID が正しいか (32桁の英数字)\n• Gist が削除されていないか\n• ネットワーク接続が有効か')
  }
}

// ============================================================
// 計算
// ============================================================

function round1(n) { return Math.round(n*10)/10 }
// 製剤文字列から濃度を解釈し、必要 mg を実際の量 (g/mL/mg/錠/包/V) に換算する。
//   戻り値: { label, amount }[] または [] (該当なし)
//   amount は文字列で、単位込みで返す ("3 g", "12.5 mL", "1.5 錠" など)
//
// 認識する記法:
//   "細粒 10%"        → solid (粉/末/細粒/顆粒/DS/散) → X% = (X*10) mg/g
//   "シロップ 0.5mg/mL" → liquid → X mg/mL
//   "シロップ 0.2%"   → liquid → X% = (X*10) mg/mL
//   "DS 100mg/g"     → solid → X mg/g
//   "錠 250mg"        → 1錠あたり X mg (その他: カプセル, OD錠, チュアブル錠, 散剤..)
//   "注射用 1g/V"     → 1V あたり X g (バイアル換算)
//   "顆粒 4mg/包"     → 1包あたり X mg
function parseFormulation(s) {
  if (!s) return null
  const text = String(s).trim()
  // 区切り (空白) で本体名と濃度部分に分けるが、含むキーワードを判定するため全体も使う
  const isLiquid = /シロップ|液|内用液|懸濁液|ドロップ|ドライシロップ|エリキシル|drops?|syrup/i.test(text)
  const isSolid = /細粒|顆粒|散|末|粉|DS|ドライ|ドライシロップ|G\b|granul/i.test(text) && !isLiquid
  // ドライシロップ (DS) は溶解前は固形だが、調剤時は固形として扱う (mg/g 表記が一般的)
  // X μg/mL (μg は mg に換算: 1μg = 0.001mg)
  let m = text.match(/(\d+(?:\.\d+)?)\s*(?:μg|µg|ug|mcg)\s*\/\s*ml/i)
  if (m) return { kind: 'mg_per_mL', value: +m[1]/1000, displayUnit: 'mL', formText: text }
  // X mg/mL
  m = text.match(/(\d+(?:\.\d+)?)\s*mg\s*\/\s*ml/i)
  if (m) return { kind: 'mg_per_mL', value: +m[1], displayUnit: 'mL', formText: text }
  // X μg/g (DS, 細粒)
  m = text.match(/(\d+(?:\.\d+)?)\s*(?:μg|µg|ug|mcg)\s*\/\s*g/i)
  if (m) {
    const ppm0 = text.match(/(\d+(?:\.\d+)?)\s*g\s*\/\s*包/i)
    return { kind: 'mg_per_g', value: +m[1]/1000, displayUnit: 'g', formText: text, perPacketG: ppm0 ? +ppm0[1] : null }
  }
  // X mg/g (DS, 細粒)
  m = text.match(/(\d+(?:\.\d+)?)\s*mg\s*\/\s*g/i)
  if (m) {
    // 副情報として「Y g/包」(1包あたりのg数) も拾う → 換算結果に "X g (= P 包)" を併記
    const ppm = text.match(/(\d+(?:\.\d+)?)\s*g\s*\/\s*包/i)
    const perPacketG = ppm ? +ppm[1] : null
    return { kind: 'mg_per_g', value: +m[1], displayUnit: 'g', formText: text, perPacketG }
  }
  // X mg/包 (分包品)
  m = text.match(/(\d+(?:\.\d+)?)\s*mg\s*\/\s*包/)
  if (m) return { kind: 'mg_per_unit', value: +m[1], displayUnit: '包', formText: text }
  // X mg/V (バイアル, 注射剤)
  m = text.match(/(\d+(?:\.\d+)?)\s*mg\s*\/\s*V/i)
  if (m) return { kind: 'mg_per_unit', value: +m[1], displayUnit: 'V', formText: text }
  m = text.match(/(\d+(?:\.\d+)?)\s*g\s*\/\s*V/i)
  if (m) return { kind: 'mg_per_unit', value: +m[1] * 1000, displayUnit: 'V', formText: text }
  // X mg/ブリスター (吸入剤)
  m = text.match(/(\d+(?:\.\d+)?)\s*mg\s*\/\s*ブリスター/)
  if (m) return { kind: 'mg_per_unit', value: +m[1], displayUnit: 'ブリスター', formText: text }
  // X% (濃度)
  m = text.match(/(\d+(?:\.\d+)?)\s*%/)
  if (m) {
    const pct = +m[1]
    if (isLiquid) return { kind: 'mg_per_mL', value: pct * 10, displayUnit: 'mL', formText: text }
    if (isSolid) return { kind: 'mg_per_g', value: pct * 10, displayUnit: 'g', formText: text }
    // どちらか不明 → 固形扱い (DS や細粒/散で % 表記が圧倒的に多い)
    return { kind: 'mg_per_g', value: pct * 10, displayUnit: 'g', formText: text }
  }
  // 単位用量 (錠, カプセル, 坐剤, OD錠, チュアブル錠, バッグ, バイアル, アンプル, キット ..)
  // 例: "錠 250mg" / "錠 100/200mg" / "坐剤 100/200/400mg" / "点滴静注液バッグ 300mg"
  // μg 単位の錠 (例: "錠 10μg", "エアゾール 50μg") を先に判定 (1μg = 0.001mg)
  m = text.match(/(\d+(?:\.\d+)?)\s*(?:μg|µg|ug|mcg)(?!\s*\/)/i)
  if (m) {
    return { kind: 'mg_per_unit', value: +m[1]/1000, displayUnit: guessUnitLabel(text), formText: text }
  }
  m = text.match(/(\d+(?:\.\d+)?)\s*mg(?!\s*\/)/i)
  if (m) {
    return { kind: 'mg_per_unit', value: +m[1], displayUnit: guessUnitLabel(text), formText: text }
  }
  m = text.match(/(\d+(?:\.\d+)?)\s*g(?!\s*\/)/i)
  if (m) {
    return { kind: 'mg_per_unit', value: +m[1] * 1000, displayUnit: guessUnitLabel(text), formText: text }
  }
  return null
}

// 製剤文字列から単位ラベル ("錠"/"カプセル"/"バイアル" など) を推定する
function guessUnitLabel(text) {
  // 注射剤 (より具体的なものから判定)
  if (/バッグ|bag\b/i.test(text)) return 'バッグ'
  if (/バイアル|vial\b/i.test(text)) return 'バイアル'
  if (/アンプル|ampoule|ampule\b/i.test(text)) return 'アンプル'
  if (/キット/.test(text)) return 'キット'
  if (/プレフィルド|シリンジ/.test(text)) return '本'
  // 注射剤 (一般指定)
  if (/注射用|注射液|点滴|静注|筋注|皮下注/.test(text)) return 'V'
  // 経口固形剤
  if (/カプセル|capsule/i.test(text)) return 'カプセル'
  if (/OD錠/.test(text)) return 'OD錠'
  if (/チュアブル/.test(text)) return '錠'
  if (/錠/.test(text)) return '錠'
  // 坐剤・吸入・パッチ
  if (/坐剤|坐薬|座薬|suppos/i.test(text)) return '個'
  if (/吸入|inhal|ブリスター/i.test(text)) return '吸入'
  if (/パッチ|貼付|テープ/.test(text)) return '枚'
  // 包・分包 (1包あたりの記載があるもの)
  if (/分包|包/.test(text)) return '包'
  // 粉末・顆粒系 (DS等は重量で計量するため '錠' や '包' ではなく g)
  if (/DS|ドライシロップ|ドライシ|細粒|顆粒|散剤|散\b|末|粉末/.test(text)) return 'g'
  // 液剤系
  if (/シロップ|液|ドロップ/.test(text)) return 'mL'
  return '個'  // デフォルト
}

// 必要 mg 量から、各 formulation で必要な実数量を計算する。
//   needMg: 必要 mg 量 (単一値)
//   forms: drug.formulations (string[] または object[])
//   戻り値: { formText, amountStr }[]  (患者の年齢/体重に合わない剤形は除外)
function buildFormulationAmounts(needMg, forms, dose) {
  if (!Array.isArray(forms) || forms.length === 0) return []
  if (!isFinite(needMg) || needMg <= 0) return []
  const round = (v) => {
    if (!isFinite(v)) return '?'
    if (v >= 100) return Math.round(v).toString()
    if (v >= 10) return (Math.round(v * 10) / 10).toString()
    return (Math.round(v * 100) / 100).toString()
  }
  const am = ageToMonths()
  const w = parseFloat(state.weight)
  return forms.map(f => {
    const norm = normalizeFormulation(f)
    if (!norm) return null
    if (!isFormulationAllowed(norm, am, w, dose)) return null  // 年齢/体重制約に合わない剤形は除外
    const p = parseFormulation(norm.text)
    if (!p) return null
    let amount
    if (p.kind === 'mg_per_mL' || p.kind === 'mg_per_g' || p.kind === 'mg_per_unit') {
      amount = needMg / p.value
      let amountStr = `${round(amount)} ${p.displayUnit}`
      // mg/g 形式 + 1包あたりのg数が指定されていれば包数を併記
      // 例: "クラバモックス配合DS 600mg/g (1.01g/包)" → "2.1 g (= 2.08 包)"
      if (p.kind === 'mg_per_g' && p.perPacketG && p.perPacketG > 0) {
        const packets = amount / p.perPacketG
        amountStr = `${round(amount)} g (= ${round(packets)} 包)`
      }
      // notes (例: "1包 1.01g中 AMPC 600mg") を補助情報として返す
      return { formText: p.formText, amountStr, notes: norm.notes || '', amountValue: amount, amountUnit: p.displayUnit }
    }
    return null
  }).filter(Boolean)
}

function calcDoseResult(dose, weight) {
  // 固定量は体重に依存しないため、体重未入力でも結果を返す
  if (dose.fixedDose) return {text: dose.fixedDose, perDose: null, min: null, max: null}
  if (!weight || weight <= 0) return null
  const unit = dose.unit || 'mg'
  // 力価ラベル (例: "AMPC として") を 1日量・1回量の文頭に付ける
  const activePrefix = dose.activeLabel ? `${dose.activeLabel} ` : ''
  const gFmt = v => parseFloat((v/1000).toFixed(3)) + 'g'
  let text, min, max
  if (dose.dosePerKg) {
    const t = round1(Math.min(dose.dosePerKg*weight, dose.maxDosePerDay??Infinity))
    text=`${activePrefix}${t} ${unit}/日`; min=max=t
  } else if (dose.dosePerKgMin!=null && dose.dosePerKgMax!=null) {
    const lo=round1(Math.min(dose.dosePerKgMin*weight, dose.maxDosePerDay??Infinity))
    const hi=round1(Math.min(dose.dosePerKgMax*weight, dose.maxDosePerDay??Infinity))
    text = lo===hi ? `${activePrefix}${lo} ${unit}/日` : `${activePrefix}${lo}〜${hi} ${unit}/日`
    min=lo; max=hi
  } else return null
  // activeLabel (例: TMP力価) のある mg 用量は g 換算も併記
  if (dose.activeLabel && unit === 'mg') {
    const gLo=gFmt(min); const gHi=gFmt(max)
    text += gLo===gHi ? `（${gLo}）` : `（${gLo}〜${gHi}）`
  }
  let perDose=null
  // "分N" または "分N〜M" を解釈し、可能な分割回数の最小と最大を取得
  //   1回量の幅 = (1日量min ÷ 分割最大) 〜 (1日量max ÷ 分割最小)
  const m=dose.frequency?.match(/分(\d+)(?:[〜~](\d+))?/)
  let nMin = null, nMax = null
  if (m) {
    nMin = parseInt(m[1])
    nMax = m[2] ? parseInt(m[2]) : nMin
    const perLo = min / nMax   // 一番小さい 1回量 (大きい分割で割る)
    const perHi = max / nMin   // 一番大きい 1回量 (小さい分割で割る)
    let pd = perLo===perHi?`1回 ${activePrefix}${round1(perLo)} ${unit}`:`1回 ${activePrefix}${round1(perLo)}〜${round1(perHi)} ${unit}`
    if (dose.activeLabel && unit === 'mg') {
      const gLo=gFmt(perLo); const gHi=gFmt(perHi)
      pd += gLo===gHi ? `（${gLo}）` : `（${gLo}〜${gHi}）`
    }
    perDose = pd
  }
  // 通常用量 (dosePerKgTypical) があれば別行で表示
  let typical = null
  if (dose.dosePerKgTypical != null && dose.dosePerKgTypical !== '' && !dose.dosePerKg) {
    const tv = round1(Math.min(dose.dosePerKgTypical * weight, dose.maxDosePerDay ?? Infinity))
    let typText = `通常 ${activePrefix}${tv} ${unit}/日`
    if (nMin != null) {
      if (nMin === nMax) {
        typText += `（1回 ${round1(tv/nMin)} ${unit}）`
      } else {
        typText += `（1回 ${round1(tv/nMax)}〜${round1(tv/nMin)} ${unit}）`
      }
    }
    typical = typText
  }
  return {text, perDose, min, max, typical}
}

function saveSteroidData() {
  localStorage.setItem('steroid_data', JSON.stringify({
    ranks: STEROID_RANKS, nonsteroid: STEROID_NONSTEROID_REFS, severity: STEROID_SEVERITY
  }))
  // GitHub Gist にもプッシュ (token + gistId が設定されていれば)
  pushSteroidToGist().catch(e => console.warn('[Gist push] 失敗:', e?.message || e))
}
async function pushSteroidToGist() {
  let tokenRaw = localStorage.getItem('editor_gh_token')
  let gistIdRaw = localStorage.getItem('master_gist_id') || localStorage.getItem('editor_gist_id')
  if (!tokenRaw || !gistIdRaw) return false
  // editor 側は JSON.stringify で保存しているため、生取得時に "..." 付きで返ることがある
  let token, gistId
  try { token = JSON.parse(tokenRaw) } catch { token = tokenRaw }
  try { gistId = JSON.parse(gistIdRaw) } catch { gistId = gistIdRaw }
  if (!token || !gistId) return false
  // 既存 Gist データに steroid* を上書きして PATCH
  let baseData = {}
  try { baseData = JSON.parse(localStorage.getItem(GIST_LS_CACHE) || '{}') || {} } catch { baseData = {} }
  baseData.steroidRanks = STEROID_RANKS
  baseData.steroidSeverity = STEROID_SEVERITY
  baseData.steroidNonsteroid = STEROID_NONSTEROID_REFS
  baseData.updatedAt = new Date().toISOString()
  const body = JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(baseData, null, 2) } } })
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    method: 'PATCH',
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body
  })
  if (!res.ok) throw new Error(`Gist PATCH HTTP ${res.status}`)
  // ローカルキャッシュも更新 (次回起動時に差分検知が走らないように)
  LS.set(GIST_LS_CACHE, baseData)
  localStorage.setItem(GIST_LS_CACHE_AT, String(Date.now()))
  return true
}

function attachTopicalSteroid() {
  document.getElementById('btn-ts-back')?.addEventListener('click', () => setState({screen:'list', category:'外用薬', steroidEditing:false}))
  document.getElementById('btn-ts-edit')?.addEventListener('click', () => setState({steroidEditing:true}))
  document.getElementById('btn-ts-cancel')?.addEventListener('click', () => {
    // 編集をキャンセル: localStorage から再読み込み (未保存変更を破棄)
    try {
      const saved = JSON.parse(localStorage.getItem('steroid_data') || 'null')
      if (saved) {
        if (Array.isArray(saved.ranks))      STEROID_RANKS = saved.ranks
        if (Array.isArray(saved.nonsteroid)) STEROID_NONSTEROID_REFS = saved.nonsteroid
        if (Array.isArray(saved.severity))   STEROID_SEVERITY = saved.severity
      }
    } catch {}
    setState({steroidEditing:false})
  })
  document.getElementById('btn-ts-save')?.addEventListener('click', () => {
    // 入力中の値を STEROID_RANKS / SEVERITY / NONSTEROID に反映してから保存
    document.querySelectorAll('[data-st-rank][data-st-drug]').forEach(el => {
      const ri = +el.dataset.stRank, di = +el.dataset.stDrug, f = el.dataset.stField
      if (!STEROID_RANKS[ri] || !STEROID_RANKS[ri].drugs[di]) return
      if (f === 'generic') STEROID_RANKS[ri].drugs[di].generic = el.value
      if (f === 'forms') STEROID_RANKS[ri].drugs[di].forms = el.value.split(/\n+/).map(s => s.trim()).filter(Boolean)
    })
    document.querySelectorAll('[data-st-rank][data-st-field="desc"]').forEach(el => {
      const ri = +el.dataset.stRank
      if (STEROID_RANKS[ri]) STEROID_RANKS[ri].desc = el.value
    })
    document.querySelectorAll('[data-st-sev]').forEach(el => {
      const si = +el.dataset.stSev, ci = +el.dataset.stCol
      if (STEROID_SEVERITY[si]) STEROID_SEVERITY[si][ci] = el.value
    })
    document.querySelectorAll('[data-st-non]').forEach(el => {
      const ni = +el.dataset.stNon, f = el.dataset.stField
      if (!STEROID_NONSTEROID_REFS[ni] || !f) return
      if (f === 'forms') STEROID_NONSTEROID_REFS[ni].forms = el.value.split(/\n+/).map(s => s.trim()).filter(Boolean)
      else STEROID_NONSTEROID_REFS[ni][f] = el.value
    })
    saveSteroidData()
    setState({steroidEditing:false})
  })
  // 薬剤・参考非ステロイドの追加/削除 (再描画して入力 UI を更新)
  document.querySelectorAll('[data-st-act]').forEach(b => b.addEventListener('click', () => {
    // ボタン押下時、現在の入力中の値を一旦取り込んでから配列を変更する
    document.querySelectorAll('[data-st-rank][data-st-drug]').forEach(el => {
      const ri = +el.dataset.stRank, di = +el.dataset.stDrug, f = el.dataset.stField
      if (!STEROID_RANKS[ri] || !STEROID_RANKS[ri].drugs[di]) return
      if (f === 'generic') STEROID_RANKS[ri].drugs[di].generic = el.value
      if (f === 'forms') STEROID_RANKS[ri].drugs[di].forms = el.value.split(/\n+/).map(s => s.trim()).filter(Boolean)
    })
    document.querySelectorAll('[data-st-non]').forEach(el => {
      const ni = +el.dataset.stNon, f = el.dataset.stField
      if (!STEROID_NONSTEROID_REFS[ni] || !f) return
      if (f === 'forms') STEROID_NONSTEROID_REFS[ni].forms = el.value.split(/\n+/).map(s => s.trim()).filter(Boolean)
      else STEROID_NONSTEROID_REFS[ni][f] = el.value
    })
    const act = b.dataset.stAct
    if (act === 'add-drug') {
      const ri = +b.dataset.stRank
      if (STEROID_RANKS[ri]) STEROID_RANKS[ri].drugs.push({ generic:'', forms:[] })
    } else if (act === 'del-drug') {
      const ri = +b.dataset.stRank, di = +b.dataset.stDrug
      if (STEROID_RANKS[ri]) STEROID_RANKS[ri].drugs.splice(di, 1)
    } else if (act === 'add-non') {
      STEROID_NONSTEROID_REFS.push({ generic:'', cls:'', strength:'', forms:[] })
    } else if (act === 'del-non') {
      const ni = +b.dataset.stNon
      STEROID_NONSTEROID_REFS.splice(ni, 1)
    }
    render()
  }))
}

function asthmaAgeGroupFromInput() {
  const raw = parseFloat(state.asthmaAgeInput)
  if (!Number.isFinite(raw) || raw < 0) return null
  const months = state.asthmaAgeUnit === 'months' ? raw : raw * 12
  return JPGL_2023.ageGroups.find(g => months >= g.minMonths && months <= g.maxMonths) || null
}
function asthmaControlVerdict() {
  const ans = state.asthmaControlAnswers || {}
  const keys = JPGL_2023.controlItems.map(i => i.key)
  const answered = keys.every(k => ans[k])
  if (!answered) return null
  const rank = v => v==='poor'?2 : v==='fair'?1 : 0
  const worst = keys.map(k => rank(ans[k])).reduce((a,b) => Math.max(a,b), 0)
  return worst === 2 ? 'poor' : worst === 1 ? 'fair' : 'good'
}

  // Step 別使用例

// 1回量 + 服用回数 → "1日量 N mg (1回 X mg × 1日 Y 回)" 形式で表示するヘルパー
function fmtFluDose(mgPerDose, freq, opts={}) {
  const perDoseExtra = opts.perDoseExtra ? ` <span class="text-[11px] font-normal text-gray-600">(${esc(opts.perDoseExtra)})</span>` : ''
  const duration = opts.duration ? ` <span class="text-[11px] font-normal text-gray-600">× ${esc(opts.duration)}</span>` : ''
  const warn = opts.warn || ''
  const freqStr = String(freq||'')
  const timesMatch = freqStr.match(/(\d+)\s*回\s*\/\s*日/)
  if (timesMatch) {
    const n = +timesMatch[1]
    const totalRaw = mgPerDose * n
    const total = Number.isInteger(totalRaw) ? totalRaw : +totalRaw.toFixed(1)
    const perRaw = mgPerDose
    const per = Number.isInteger(+perRaw) ? perRaw : +(+perRaw).toFixed(1)
    return `<div class="text-sm font-bold text-gray-900">1日量 ${total} mg${warn} <span class="text-[11px] font-normal text-gray-700">(1回 ${per} mg${perDoseExtra} × 1日 ${n} 回)</span>${duration}</div>`
  }
  // 単回・頓用: 1日量 = 1回量 として「1日量 X mg (1回 X mg × 単回)」で統一
  const perRaw = mgPerDose
  const per = Number.isInteger(+perRaw) ? perRaw : +(+perRaw).toFixed(1)
  // duration が「単回のみ」など単回を含む場合は冗長なので省略
  const durKeep = /単回|単日/.test(opts.duration||'') ? '' : duration
  return `<div class="text-sm font-bold text-gray-900">1日量 ${per} mg${warn} <span class="text-[11px] font-normal text-gray-700">(1回 ${per} mg${perDoseExtra} × 単回)</span>${durKeep}</div>`
}

function renderInfluenzaRx() {
  const w = parseFloat(state.fluWeight) || 0
  const rawAge = parseFloat(state.fluAge)
  const ageMo = Number.isFinite(rawAge) && rawAge >= 0
    ? (state.fluAgeUnit === 'months' ? rawAge : rawAge * 12) : null
  const mode = state.fluMode || 'treatment'
  // 各薬剤を評価
  const drugCards = INFLUENZA_RX.drugs.map(drug => {
    const spec = drug[mode]
    const colorBg = { sky:'border-sky-300 bg-sky-50', teal:'border-teal-300 bg-teal-50',
                      violet:'border-violet-300 bg-violet-50', orange:'border-orange-300 bg-orange-50',
                      rose:'border-rose-300 bg-rose-50' }[drug.color]
    const colorBadge = { sky:'bg-sky-500', teal:'bg-teal-500', violet:'bg-violet-500',
                         orange:'bg-orange-500', rose:'bg-rose-500' }[drug.color]
    // 予防適応がない or 年齢・体重不足で使えない
    if (!spec) {
      return `<div class="rounded-xl border border-gray-200 bg-gray-50 opacity-60 p-3 space-y-1">
        <div class="flex items-baseline gap-2 flex-wrap">
          <span class="text-sm font-bold text-gray-600">${esc(drug.name)}</span>
          <span class="text-[11px] text-gray-500">${esc(drug.brand)}</span>
          <span class="text-[9px] bg-gray-300 text-gray-700 px-1.5 py-0.5 rounded">${mode==='prophylaxis'?'予防適応なし':'適応外'}</span>
        </div>
      </div>`
    }
    const ageOk = ageMo == null || ageMo >= spec.ageMinMonths
    // 用量計算
    let doseDisplay = ''
    let ageSpecific = ''
    if (ageOk) {
      // 1歳未満ルール (タミフル)
      if (drug.id === 'oseltamivir' && mode==='treatment' && ageMo != null && ageMo < 12 && w > 0) {
        const dose = +Math.min(w * spec.infantRule.perKgMg, spec.infantRule.maxPerDose).toFixed(1)
        const conc = spec.dsConc || 30
        const tM = String(spec.freq||'').match(/(\d+)\s*回\s*\/\s*日/)
        const times = tM ? +tM[1] : 2
        const perKgDaily = spec.infantRule.perKgMg * times  // 3 mg/kg × 2回 = 6 mg/kg/日
        doseDisplay = `<div class="text-xs text-sky-700 font-bold">${perKgDaily} mg/kg/日 (${spec.infantRule.perKgMg} mg/kg × ${times}回/日) → ${w} kg なら</div>`
          + fmtFluDose(dose, spec.freq, { duration:spec.duration, perDoseExtra:`DS ${(conc/10).toFixed(0)}%: 1回 ${(dose/conc).toFixed(2)} g` })
          + `<div class="text-[10px] text-gray-500">${esc(spec.infantRule.label)}</div>`
      } else if (spec.doseByWeight && w > 0) {
        const bracket = spec.doseByWeight.find(b => w < b.maxKg) || spec.doseByWeight[spec.doseByWeight.length-1]
        const extra = bracket.dsG ? `DS 3%: 1回 ${bracket.dsG} g` : ''
        // 12歳未満キャップ (ゾフルーザ: 体重に関わらず最大 40 mg)
        let actualDose = bracket.mgPerDose
        let capNote = ''
        if (spec.pedMaxMg && ageMo != null && ageMo < 144 && bracket.mgPerDose > spec.pedMaxMg) {
          actualDose = spec.pedMaxMg
          capNote = `<div class="text-[10px] bg-amber-50 border border-amber-200 text-amber-800 rounded px-2 py-1 mt-1">⚠ 12歳未満は体重に関わらず最大 ${spec.pedMaxMg} mg に制限 (2020年添付文書)</div>`
        }
        doseDisplay = fmtFluDose(actualDose, spec.freq, { duration:spec.duration, perDoseExtra:extra })
          + `<div class="text-[11px] text-gray-700">体重 ${esc(bracket.label)}</div>`
          + capNote
      } else if (spec.doseByAge && ageMo != null) {
        const bracket = spec.doseByAge.find(b => ageMo < b.ageMaxMonths) || spec.doseByAge[spec.doseByAge.length-1]
        if (bracket.mgPerDose) {
          doseDisplay = fmtFluDose(bracket.mgPerDose, bracket.freq || spec.freq, { duration:spec.duration, perDoseExtra:bracket.perDoseNote })
            + `<div class="text-[11px] text-gray-700">${esc(bracket.label)}</div>`
        } else {
          doseDisplay = `<div class="text-sm font-bold text-gray-900">${esc(bracket.fixedDose)}</div>
            <div class="text-[11px] text-gray-700">${esc(bracket.label)}${spec.duration?' × '+esc(spec.duration):''}</div>`
        }
      } else if (spec.mgPerDose) {
        doseDisplay = fmtFluDose(spec.mgPerDose, spec.freq, { duration:spec.duration, perDoseExtra:spec.perDoseNote })
      } else if (spec.fixedDose) {
        doseDisplay = `<div class="text-sm font-bold text-gray-900">${esc(spec.fixedDose)}${spec.duration?' × '+esc(spec.duration):''}</div>`
      } else if (spec.perKgMg && w > 0) {
        const dose = +Math.min(w * spec.perKgMg, spec.maxPerDose).toFixed(1)
        const isCapped = w * spec.perKgMg > spec.maxPerDose
        const warn = isCapped ? ' <span class="text-[9px] bg-amber-500 text-white px-1 rounded">⚠最大量</span>' : ''
        const dsNote = spec.dsConc ? `DS ${(spec.dsConc/10).toFixed(0)}%: 1回 ${(dose/spec.dsConc).toFixed(2)} g` : ''
        const tM = String(spec.freq||'').match(/(\d+)\s*回\s*\/\s*日/)
        const times = tM ? +tM[1] : 1
        const perKgDaily = +(spec.perKgMg * times).toFixed(1)
        doseDisplay = `<div class="text-xs text-sky-700 font-bold">${perKgDaily} mg/kg/日 (${spec.perKgMg} mg/kg × ${times}${tM?'回/日':'回'}) → ${w} kg なら</div>`
          + fmtFluDose(dose, spec.freq, { duration:spec.duration, warn, perDoseExtra:dsNote })
          + `<div class="text-[10px] text-gray-500">${spec.formulaNote || `1回最大 ${spec.maxPerDose} mg${spec.maxSevere?`（重症例は最大 ${spec.maxSevere} mg）`:''}`}</div>`
      } else {
        doseDisplay = `<div class="text-[11px] text-gray-500">体重または年齢を入力してください</div>`
      }
    } else {
      ageSpecific = `<div class="text-[11px] bg-rose-50 border border-rose-200 text-rose-700 rounded px-2 py-1">⚠ この年齢では ${mode==='treatment'?'治療':'予防'} 適応外 (${(spec.ageMinMonths/12).toFixed(spec.ageMinMonths<12?1:0)} 歳以上)</div>`
    }
    const timing = spec.timing ? `<div class="text-[10px] text-gray-500">⏱ ${esc(spec.timing)}</div>` : ''
    const forms = drug.forms.map(f => `<li class="text-[10px] text-gray-600">▸ ${esc(f)}</li>`).join('')
    const note = drug.note ? `<div class="text-[10px] bg-amber-50 border border-amber-200 text-amber-800 rounded px-2 py-1 leading-relaxed">⚠ ${esc(drug.note)}</div>` : ''
    return `<div class="rounded-xl border-2 ${ageOk?colorBg:'border-gray-200 bg-gray-50 opacity-70'} p-3 space-y-2">
      <div class="flex items-baseline gap-2 flex-wrap">
        <span class="${colorBadge} text-white text-[10px] font-bold px-2 py-0.5 rounded">${esc(drug.brand)}</span>
        <span class="text-sm font-bold text-gray-900">${esc(drug.name)}</span>

      </details>
      ${note}
    </div>`
  }).join('')
  const generalNotes = INFLUENZA_RX.generalNotes.map(n => `<li class="flex gap-2 text-[11px] text-gray-700 leading-relaxed"><span class="text-sky-500 shrink-0">▸</span><span>${esc(n)}</span></li>`).join('')
  return `

// ── 急性喘息発作対応 ────────────────────────────────────────
function attackGradeFromAnswers() {
  const ans = state.attackGradeAnswers || {}
  const order = { mild:0, moderate:1, severe:2, critical:3 }
  const keys = ASTHMA_ATTACK.gradeItems.map(i => i.key)
  const scores = keys.map(k => ans[k] ? order[ans[k]] : null).filter(x => x != null)
  if (scores.length === 0) return null
  const worst = Math.max(...scores)
  return ['mild','moderate','severe','critical'][worst]
}

  const w = parseFloat(state.attackWeight) || 0

  const sevInfo = ASTHMA_ATTACK.severityLevels.find(x => x.key === sev)
  const tx = ASTHMA_ATTACK.treatment[sev]

  const mdiRows = ASTHMA_ATTACK.sabaMdi.map(m => {
    const isMatch = ageMo != null && ageMo >= m.minMo && ageMo < m.maxMo
    return `<tr class="${isMatch?'bg-sky-200 font-bold':''}">
      <td class="border border-sky-200 px-2 py-1 text-[11px] text-sky-900">${esc(m.label)}</td>

// ── アトピー塗布量計算 (FTU法) ─────────────────────────────
function renderAtopyFtu() {
  const grp = ATOPY_FTU.ageGroups.find(g => g.key === state.atopyAgeGroup) || ATOPY_FTU.ageGroups[1]
  const selected = state.atopyAreas || {}
  const freq = Math.max(0, Number(state.atopyFreq) || 0)
  const days = Math.max(0, Number(state.atopyDays) || 0)
  // 選択部位の FTU 合計
  const totalFtu = ATOPY_FTU.areas.reduce((sum, a) => selected[a.key] ? sum + (grp.ftu[a.key] || 0) : sum, 0)
  const perApp = totalFtu * ATOPY_FTU.gramPerFtu       // 1回量 (g)
  const perDay = perApp * freq                          // 1日量 (g)
  const total  = perDay * days                          // 総量 (g)
  const areaRows = ATOPY_FTU.areas.map(a => {
    const ftu = grp.ftu[a.key] || 0
    const checked = !!selected[a.key]
    return `
    <label class="flex items-center gap-3 px-3 py-2.5 border-b border-gray-100 last:border-0 cursor-pointer hover:bg-purple-50">
      <input type="checkbox" data-atopy-area="${a.key}" ${checked?'checked':''} class="w-5 h-5 accent-purple-600" />
      <div class="flex-1">
        <div class="text-sm font-medium text-gray-800">${esc(a.label)}</div>
        <div class="text-[11px] text-gray-500">1回 ${ftu} FTU ≒ ${(ftu*0.5).toFixed(2)} g</div>
      </div>
      ${checked ? `<span class="text-xs font-mono text-purple-700">+${(ftu*0.5).toFixed(2)}g</span>` : ''}
    </label>`
  }).join('')
  const ageBtns = ATOPY_FTU.ageGroups.map(g => `
    <button data-atopy-age="${g.key}" class="px-3 py-2 text-xs font-medium border rounded-lg ${state.atopyAgeGroup===g.key?'bg-purple-600 text-white border-purple-600':'bg-white text-gray-700 border-gray-300'}">${esc(g.label)}</button>
  `).join('')
  const tubeRows = ATOPY_FTU.tubeOptions.map(size => {
    const tubes = total > 0 ? Math.ceil(total / size) : 0
    return `<div class="flex items-baseline justify-between px-3 py-1.5 border-b border-gray-100 last:border-0">
      <span class="text-xs text-gray-700">${size} g チューブ</span>
      <span class="text-sm font-bold text-purple-700">${tubes} 本</span>
    </div>`
  }).join('')
  const notesHtml = ATOPY_FTU.notes.map(t => `<li class="flex gap-2 text-[11px] text-gray-600 leading-relaxed"><span class="text-purple-500 shrink-0">▸</span><span>${esc(t)}</span></li>`).join('')
  const disabledCalc = totalFtu === 0
  return `
    <div class="bg-white border-b border-gray-200 px-4 py-3">
      <div class="flex items-center gap-2">
        <button id="btn-atopy-back" class="text-blue-600 text-3xl font-light w-8">‹</button>
        <div class="flex-1 text-center min-w-0">
          <div class="font-bold text-gray-900 text-base leading-tight">🧴 アトピー塗布量計算 (FTU法)</div>
          <div class="text-xs text-gray-500">Fingertip Unit: 1 FTU ≒ 0.5 g</div>
        </div>
        <div class="w-8"></div>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto bg-gray-50 p-4 space-y-4">
      <div class="bg-white rounded-xl border border-gray-200 p-3 space-y-3">
        <div class="text-xs font-bold text-gray-700">👶 年齢群</div>
        <div class="flex flex-wrap gap-2">${ageBtns}</div>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <div class="px-3 py-2 bg-gray-50 border-b border-gray-200 text-xs font-bold text-gray-700">🗺 塗布部位 (複数選択)</div>
        <div class="bg-white">${areaRows}</div>
        ${totalFtu > 0 ? `<div class="bg-purple-50 px-3 py-2 border-t border-purple-200 flex items-baseline justify-between">
          <span class="text-xs font-medium text-purple-700">合計 FTU</span>
          <span class="text-sm font-bold text-purple-900">${totalFtu} FTU ≒ ${perApp.toFixed(2)} g /回</span>
        </div>` : ''}
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-3 space-y-3">
        <div class="text-xs font-bold text-gray-700">⏱ 塗布回数 × 日数</div>
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-[11px] text-gray-500">1日回数</label>
            <input id="atopy-freq" type="text" inputmode="numeric" pattern="[0-9]*" value="${esc(state.atopyFreq)}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
          </div>
          <div class="space-y-1">
            <label class="text-[11px] text-gray-500">処方日数</label>
            <input id="atopy-days" type="text" inputmode="numeric" pattern="[0-9]*" value="${esc(state.atopyDays)}" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500" />
          </div>
        </div>
      </div>
      <div class="rounded-xl border-2 ${disabledCalc?'border-gray-200 bg-gray-100':'border-purple-400 bg-purple-50'} p-4 space-y-3">
        <div class="flex items-baseline justify-between">
          <span class="text-xs font-bold ${disabledCalc?'text-gray-500':'text-purple-800'}">🧮 計算結果</span>
          ${!disabledCalc ? `<span class="text-[11px] text-purple-600">${esc(grp.label)} / ${freq}回/日 × ${days}日</span>` : ''}
        </div>
        ${disabledCalc
          ? `<div class="text-xs text-gray-500 text-center py-2">塗布部位を1つ以上選択してください</div>`
          : `<div class="grid grid-cols-3 gap-2">
              <div class="bg-white rounded-lg p-2 text-center">
                <div class="text-[10px] text-gray-500">1回量</div>
                <div class="text-lg font-bold text-purple-800">${perApp.toFixed(2)} g</div>
                <div class="text-[10px] text-gray-500">(${totalFtu} FTU)</div>
              </div>
              <div class="bg-white rounded-lg p-2 text-center">
                <div class="text-[10px] text-gray-500">1日量</div>
                <div class="text-lg font-bold text-purple-800">${perDay.toFixed(2)} g</div>
                <div class="text-[10px] text-gray-500">(×${freq}回)</div>
              </div>
              <div class="bg-white rounded-lg p-2 text-center">
                <div class="text-[10px] text-gray-500">総必要量</div>
                <div class="text-lg font-bold text-purple-800">${total.toFixed(1)} g</div>
                <div class="text-[10px] text-gray-500">(×${days}日)</div>
              </div>
            </div>
            <div class="bg-white rounded-lg overflow-hidden border border-purple-200">
              <div class="px-3 py-1.5 bg-purple-100 text-[11px] font-bold text-purple-800">📦 チューブ本数 (切り上げ)</div>
              ${tubeRows}
            </div>`
        }
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-3">
        <div class="text-xs font-bold text-gray-700 mb-2">📘 FTU 法メモ</div>
        <ul class="space-y-1.5">${notesHtml}</ul>
      </div>
      <div class="bg-gray-100 rounded-xl p-3 text-[11px] text-gray-500 leading-relaxed">出典: Fingertip Unit 法 (Long CC, Finlay AY. 1991) / アトピー性皮膚炎診療ガイドライン 2024。部位別 FTU は小児皮膚科標準値。本ツールは目安であり、担当医の判断で調整してください。</div>
    </div>`
}

function renderMoisturizers() {
  const dots = n => '●'.repeat(n) + '○'.repeat(5 - n)
  const catLabels  = { heparinoid:'ヘパリン類似物質', urea:'尿素製剤', petrolatum:'ワセリン系', other:'その他 (亜鉛華・アズレン)' }

  const seasonColors = { pink:'bg-pink-500 text-white border-pink-300', sky:'bg-sky-500 text-white border-sky-300', amber:'bg-amber-500 text-white border-amber-300', indigo:'bg-indigo-500 text-white border-indigo-300' }
  const seasonBg   = { pink:'bg-pink-50 border-pink-200', sky:'bg-sky-50 border-sky-200', amber:'bg-amber-50 border-amber-200', indigo:'bg-indigo-50 border-indigo-200' }

      </div>
    </div>
  `).join('')
  // ── 剤形比較表 ──
  const cellTh = 'border border-gray-200 px-2 py-1.5 text-[10px] font-bold bg-gray-100 text-gray-700 text-center'

  const catCards = Object.entries(byCat).map(([cat, items]) => {
    const c = catColors[cat] || 'gray'
    return `
      <div class="rounded-xl border border-${c}-200 overflow-hidden">
        <div class="bg-${c}-500 text-white px-3 py-2 flex items-center gap-2">

        <div class="bg-white divide-y divide-gray-100">
          ${items.map(m => `
            <div class="px-3 py-3 space-y-2">
              <div class="flex items-baseline gap-2 flex-wrap">
                <span class="text-sm font-bold text-gray-900">${esc(m.generic)}</span>
                <span class="text-[10px] text-gray-500">${esc(m.cls || '')}</span>
              </div>
              ${m.notes ? `<div class="text-[11px] text-gray-600 leading-relaxed bg-gray-50 rounded p-2">${esc(m.notes)}</div>` : ''}

const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

// 日本語検索用の正規化:
//   ・ひらがな → カタカナ (例: あもきししりん → アモキシシリン に一致)
//   ・全角英数 → 半角 (NFKC)
//   ・小文字化、トリム
function jpNorm(s) {
  if (s == null) return ''
  let v = String(s)
  try { v = v.normalize('NFKC') } catch {}
  // ひらがな(U+3041..U+3096) → カタカナ(U+30A1..U+30F6) は +0x60
  v = v.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
  return v.toLowerCase().trim()
}

// IME対応テキスト入力: 日本語変換中は再描画しない
function bindTextInput(id, callback) {
  const el = document.getElementById(id)
  if (!el) return
  let composing = false
  el.addEventListener('compositionstart', () => { composing = true })
  el.addEventListener('compositionend', e => { composing = false; callback(e.target.value) })
  el.addEventListener('input', e => { if (!composing) callback(e.target.value) })
}

// 数値入力 (年齢・体重): IME不要だが統一のため同ヘルパー経由
function bindNumericInput(id, callback) {
  const el = document.getElementById(id)
  if (!el) return
  el.addEventListener('input', e => callback(e.target.value))
}

function doseCard(dose, weight, compact=false, drug=null) {
  const result = calcDoseResult(dose, weight)
  const unit = dose.unit || 'mg'
  const activePref = dose.activeLabel ? `${dose.activeLabel} として ` : ''
  // 通常用量 (dosePerKgTypical) があれば "範囲 (通常 X)" として明示
  const typicalSuffix = (dose.dosePerKgTypical != null && dose.dosePerKgTypical !== '') ? ` <span class="text-blue-700 font-semibold">(通常 ${dose.dosePerKgTypical}${unit}/kg/日)</span>` : ''
  const prescText = dose.fixedDose ? dose.fixedDose
    : dose.dosePerKg ? `${activePref}${dose.dosePerKg} ${unit}/kg/日${dose.maxDosePerDay?` ［最大${dose.maxDosePerDay}${unit}/日］`:''}`
    : dose.dosePerKgMin!=null ? `${activePref}${dose.dosePerKgMin}〜${dose.dosePerKgMax} ${unit}/kg/日${typicalSuffix}${dose.maxDosePerDay?` ［最大${dose.maxDosePerDay}${unit}/日］`:''}`
    : ''
  // 固定量の場合は処方内容そのものを青ボックスで大きく表示し、上の灰色プレ表示は省略する。
  // mg/kg の場合は、灰色の処方式 (例: 0.06 mg/kg/日) と青の計算結果 (例: 0.6 mg/日) を分けて表示。
  const isFixedDose = !!dose.fixedDose
  const resultHtml = !result ? (parseFloat(weight)>0 ? `<div class="text-gray-400 text-xs mt-1">この年齢では対象外</div>` : '')
    : `<div class="bg-blue-50 rounded-lg p-3 ${isFixedDose ? '' : 'mt-2'}">
        <div class="text-blue-800 font-bold ${compact?'text-base':'text-lg'}">${result.text}</div>
        ${result.typical ? `<div class="text-emerald-700 font-semibold text-sm mt-0.5">${esc(result.typical)}</div>` : ''}
        ${result.perDose||dose.frequency?`<div class="text-blue-600 text-sm mt-0.5">${result.perDose?result.perDose+'　':''}${dose.frequency||''}${dose.duration?'　'+dose.duration:''}</div>`:''}
      </div>`
  // 点滴希釈ボックス (注射用抗菌薬など、ivDilution が登録されている薬剤のみ)
  let ivHtml = ''
  // 注射用製剤判定 (formulations の形状から)
  const isInjectableDrug = Array.isArray(drug?.formulations) && drug.formulations.length > 0 &&
    drug.formulations.every(f => /\/V\b|\/バッグ|\/キット|\/アンプル|\/バイアル|注射用|点滴静注用/.test(String(f)))
  if (drug?.ivDilution && result && result.min != null) {
    const iv = drug.ivDilution
    const solventDisp = iv.solvent==='NS' ? '生食' : iv.solvent==='5%DW' ? '5%ブドウ糖液' : iv.solvent==='NS/5%DW' ? '生食 または 5%ブドウ糖液' : iv.solvent
    // "分N〜M" を解釈: 1回量の最小は dailyMin/M、最大は dailyMax/N
    const fm = dose.frequency?.match(/分(\d+)(?:[〜~](\d+))?/)
    const fnMin = fm ? parseInt(fm[1]) : 1
    const fnMax = fm && fm[2] ? parseInt(fm[2]) : fnMin
    const perMin = result.min / fnMax   // 1回量 (mg) の下限
    const perMax = result.max / fnMin   // 1回量 (mg) の上限
    // dilutionRatio (例: "1g/20mL", "5mg/mL", "1A/10mL", "100単位/mL") が入っていれば
    // そのまま表示。空ならば旧来の容量計算 (10mL 刻み切り上げ) で fallback。
    // infusionTime が時間 (分/時間/秒) のときだけ「かけて点滴」を付ける。
    // 「IV可能」「急速静注可」など時間以外の表記には付けない。
    const infTime = iv.infusionTime ? String(iv.infusionTime).trim() : ''
    const isDuration = /分|時間|秒/.test(infTime)
    const timePart = infTime
      ? (isDuration ? `<strong>${esc(infTime)}</strong> かけて点滴` : `<strong>${esc(infTime)}</strong>`)
      : ''
    let mainLine, ratioHtml = ''
    if (iv.dilutionRatio && String(iv.dilutionRatio).trim()) {
      mainLine = `${esc(solventDisp)} で <strong>${esc(iv.dilutionRatio)}</strong> に希釈${timePart ? '、' + timePart : ''}`
    } else {
      let ratioStr = ''
      if (iv.reconstitutionMlPerGram) ratioStr = `1g/${iv.reconstitutionMlPerGram}mL`
      const calcVol = perDoseMg => {
        if (perDoseMg <= 1000) return 10
        const required = iv.reconstitutionMlPerGram
          ? perDoseMg / 1000 * iv.reconstitutionMlPerGram
          : (iv.maxConcMgPerMl ? perDoseMg / iv.maxConcMgPerMl : 10)
        return Math.max(10, Math.ceil(required / 10) * 10)
      }
      const volMin = calcVol(perMin)
      const volMax = calcVol(perMax)
      const volStr = volMin===volMax ? `${volMin}mL` : `${volMin}〜${volMax}mL`
      mainLine = `${esc(solventDisp)} <strong>${volStr}</strong> に溶解${timePart ? '、' + timePart : ''}`
      if (ratioStr) ratioHtml = `<div class="text-[10px] text-amber-700 mt-1 opacity-80">最小溶解量: ${ratioStr}</div>`
    }
    const incompatHtml = iv.incompatible?.length
      ? `<div class="flex items-start gap-1 text-red-700 font-bold mt-2 text-xs bg-red-50 border border-red-200 rounded px-2 py-1.5"><span>⚠️</span><span>配合禁忌: ${iv.incompatible.map(s=>esc(s)).join('、')}</span></div>`
      : ''
    ivHtml = `<div class="border border-amber-200 bg-amber-50 rounded-lg p-3 mt-2">
      <div class="text-xs font-semibold text-amber-700 mb-1">💉 点滴希釈</div>
      <div class="text-sm text-amber-900">${mainLine}</div>
      ${ratioHtml}
      ${incompatHtml}
    </div>`
  } else if (isInjectableDrug && result) {
    // ivDilution が登録されていない注射用製剤: 注意書きを出す（編集や置換で点滴情報が失われた場合のフォールバック）
    ivHtml = `<div class="border border-amber-200 bg-amber-50 rounded-lg p-3 mt-2">
      <div class="text-xs font-semibold text-amber-700 mb-1">💉 注射用製剤</div>
      <div class="text-xs text-amber-800">点滴希釈情報が登録されていません。添付文書を確認してください。</div>
    </div>`
  }
  // 製剤量換算 (mg / g / μg ベースの用量に対応)
  // 単位 → mg 変換係数。null は換算不可 (mL, IU, 包, カプセル など)
  const unitMgFactor = (u) => u === 'mg' ? 1 : u === 'g' ? 1000 : (u === 'μg' || u === 'ug') ? 0.001 : null
  const factor = unitMgFactor(unit)
  let formulationsHtml = ''
  // 注射用製剤 (ivDilution あり、または formulations が "/V" 終わり等) は V換算が無意味なので非表示にする
  if (result && drug && factor !== null && Array.isArray(drug.formulations) && drug.formulations.length > 0 && !drug.ivDilution && !isInjectableDrug) {
    // 1日量と1回量の両方を計算 (dose.unit 単位で算出後に mg へ変換)
    const freq = (() => { const m = dose.frequency?.match(/分(\d+)/); return m ? parseInt(m[1]) : null })()
    let dailyMin, dailyMax  // dose.unit 単位
    if (dose.dosePerKg) {
      dailyMin = dailyMax = Math.min(dose.dosePerKg * weight, dose.maxDosePerDay ?? Infinity)
    } else if (dose.dosePerKgMin != null && dose.dosePerKgMax != null) {
      dailyMin = Math.min(dose.dosePerKgMin * weight, dose.maxDosePerDay ?? Infinity)
      dailyMax = Math.min(dose.dosePerKgMax * weight, dose.maxDosePerDay ?? Infinity)
    } else if (dose.fixedDose) {
      // 「X mg/日」「X g/日」「X μg/日」「範囲」のパターンを抽出 (dose.unit と一致しない場合も対応)
      const fd = String(dose.fixedDose)
      const unitPat = unit === 'g' ? 'g' : unit === 'μg' || unit === 'ug' ? '(?:μg|ug)' : 'mg'
      let mm = fd.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*[〜~]\\s*(\\d+(?:\\.\\d+)?)\\s*${unitPat}\\s*/\\s*日`, 'i'))
      if (mm) { dailyMin = parseFloat(mm[1]); dailyMax = parseFloat(mm[2]) }
      else {
        const m1 = fd.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*${unitPat}\\s*/\\s*日`, 'i'))
        if (m1) dailyMin = dailyMax = parseFloat(m1[1])
        else {
          const m2 = fd.match(new RegExp(`(\\d+(?:\\.\\d+)?)\\s*${unitPat}.*?1日\\s*(\\d+)\\s*回`, 'i'))
          if (m2) { dailyMin = dailyMax = parseFloat(m2[1]) * parseInt(m2[2]) }
        }
      }
    }
    if (dailyMin != null && dailyMax != null) {
      // dose の単位を mg に変換して buildFormulationAmounts に渡す
      const toMg = v => v * factor
      const buildAmount = (valMin, valMax) => {
        const mgMin = toMg(valMin); const mgMax = toMg(valMax)
        const list = buildFormulationAmounts(mgMin, drug.formulations, dose)
        if (mgMin === mgMax) return list.map(a => ({ formText: a.formText, str: a.amountStr, notes: a.notes || '' }))
        const maxList = buildFormulationAmounts(mgMax, drug.formulations, dose)
        return list.map(a => {
          const max = maxList.find(b => b.formText === a.formText)
          return { formText: a.formText, str: max ? `${a.amountStr.split(' ')[0]}〜${max.amountStr}` : a.amountStr, notes: a.notes || '' }
        })
      }
      const daily = buildAmount(dailyMin, dailyMax)
      const perDose = freq ? buildAmount(dailyMin/freq, dailyMax/freq) : []
      if (daily.length > 0) {
        // 力価ラベル付きの場合: "AMPC 換算 X mg" のような表示
        const activePrefix = dose.activeLabel ? `${dose.activeLabel} ` : ''
        const fmtUnit = unit
        const fmtAmount = v => {
          if (v >= 100) return Math.round(v).toString()
          if (v >= 10) return (Math.round(v * 10) / 10).toString()
          return (Math.round(v * 100) / 100).toString()
        }
        const activeStr = dailyMin === dailyMax
          ? `${activePrefix}${fmtAmount(dailyMin)} ${fmtUnit}/日`
          : `${activePrefix}${fmtAmount(dailyMin)}〜${fmtAmount(dailyMax)} ${fmtUnit}/日`
        const headerLabel = freq ? `1日量 (1回量 ${dose.frequency})` : '1日量'
        const rows = daily.map(d => {
          const p = perDose.find(x => x.formText === d.formText)
          const perStr = p ? `<span class="text-gray-500 text-[11px] ml-1">(1回 ${p.str})</span>` : ''
          const noteStr = d.notes ? `<div class="text-[10px] text-gray-500 leading-tight">${esc(d.notes)}</div>` : ''
          return `<div class="flex justify-between items-baseline gap-2 text-xs">
            <div class="min-w-0 flex-1">
              <div class="text-gray-600 truncate">${esc(d.formText)}</div>
              ${noteStr}
            </div>
            <span class="text-gray-800 font-semibold whitespace-nowrap">${d.str}${perStr}</span>
          </div>`
        }).join('')
        const activeBadge = dose.activeLabel
          ? `<div class="text-[11px] text-emerald-700 font-semibold mb-1">${esc(activeStr)}</div>`
          : ''
        formulationsHtml = `
          <div class="mt-2 bg-emerald-50 border border-emerald-100 rounded-lg p-2.5">
            ${activeBadge}
            <div class="text-[11px] text-gray-500 font-medium mb-1">${headerLabel}</div>
            <div class="space-y-0.5">${rows}</div>
          </div>`
      }
    }
  }
  // 成分内訳 (合剤・配合処方用): dose.components に [{label, mgPerDay}] を登録すると
  // 各成分の mg/日 と mg/kg/日、および比率を表示する。
  let componentsHtml = ''
  if (Array.isArray(dose.components) && dose.components.length > 0) {
    const w = parseFloat(weight)
    const hasW = isFinite(w) && w > 0
    const fmtMg = v => v >= 100 ? Math.round(v).toString() : v >= 10 ? (Math.round(v*10)/10).toString() : (Math.round(v*100)/100).toString()
    const validComps = dose.components.filter(c => c && c.label && isFinite(+c.mgPerDay) && +c.mgPerDay > 0)
    if (validComps.length > 0) {
      const rows = validComps.map(c => {
        const mg = +c.mgPerDay
        const perKg = hasW ? (mg / w) : null
        const perKgStr = perKg != null ? `<span class="text-gray-500 text-[11px] ml-1">(${fmtMg(perKg)} mg/kg/日)</span>` : ''
        return `<div class="flex justify-between items-baseline gap-2 text-xs">
          <span class="text-purple-800 font-semibold">${esc(c.label)}</span>
          <span class="text-gray-800 font-semibold whitespace-nowrap">${fmtMg(mg)} mg/日 ${perKgStr}</span>
        </div>`
      }).join('')
      // 比率 (2成分以上時のみ)
      let ratioStr = ''
      if (validComps.length >= 2) {
        const minComp = validComps.reduce((a, b) => +a.mgPerDay < +b.mgPerDay ? a : b)
        const ratios = validComps.map(c => `${esc(c.label)}:${(+c.mgPerDay / +minComp.mgPerDay).toFixed(1)}`).join(' = ')
        ratioStr = `<div class="text-[11px] text-purple-600 mt-1">比率 ${ratios}</div>`
      }
      componentsHtml = `
        <div class="mt-2 bg-purple-50 border border-purple-100 rounded-lg p-2.5">
          <div class="text-[11px] text-purple-700 font-medium mb-1">成分内訳${hasW?` (体重 ${w}kg)`:''}</div>
          <div class="space-y-0.5">${rows}</div>
          ${ratioStr}
        </div>`
    }
  }
  return `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="bg-gray-50 border-b border-gray-100 px-4 py-2 flex items-center justify-between">
        <span class="text-sm font-semibold text-gray-700">${dose.ageLabel}</span>
        ${purposeBadge(dose.purpose)}
      </div>
      <div class="px-4 py-3">
        ${isFixedDose ? '' : `<div class="text-sm text-gray-500">${prescText}</div>`}
        ${resultHtml}
        ${ivHtml}
        ${componentsHtml}
        ${formulationsHtml}
        ${dose.notes?`<div class="mt-2 text-xs text-amber-700 bg-amber-50 rounded-lg px-3 py-2">${esc(dose.notes)}</div>`:''}
      </div>
    </div>`
}

function filteredDoses(drug) {
  const am = ageToMonths()
  const w = parseFloat(state.weight)
  const hasWeight = isFinite(w) && w > 0
  return drug.pediatricDoses.filter(d => {
    // 年齢フィルタ (年齢未入力なら通過)
    if (am !== undefined) {
      const minOk = d.ageMinMonths==null || am>=d.ageMinMonths
      const maxOk = d.ageMaxMonths==null || am<d.ageMaxMonths
      if (!(minOk && maxOk)) return false
    }
    // 体重フィルタ (体重未入力なら通過)
    if (hasWeight) {
      const wMinOk = d.weightMinKg==null || w>=d.weightMinKg
      const wMaxOk = d.weightMaxKg==null || w<d.weightMaxKg
      if (!(wMinOk && wMaxOk)) return false
    }
    return true
  })
}

// 入力された年齢が、設定された小児用量の最小年齢を「すべて」下回っているかを判定。
//   - 全ての pediatricDoses に ageMinMonths が設定されていて、
//   - 入力年齢がすべての ageMinMonths 未満の場合 → true
function isAgeUnderPediatric(drug) {
  const am = ageToMonths()
  if (am === undefined) return false
  const doses = drug.pediatricDoses || []
  if (doses.length === 0) return false
  const minAges = doses.map(d => d.ageMinMonths).filter(v => v != null)
  if (minAges.length === 0) return false
  if (minAges.length < doses.length) return false  // 最小年齢未設定の用量があれば該当しない
  return am < Math.min(...minAges)
}

// 入力された年齢が、設定された小児用量の最大年齢を「すべて」超えているかを判定。
//   - 全ての pediatricDoses に ageMaxMonths が設定されていて、
//   - 入力年齢がすべての ageMaxMonths 以上の場合 → true
//   - どれか1つでも上限未設定 (open-ended) の用量があれば false (高年齢もカバーされていると判断)
function isAgeOverPediatric(drug) {
  const am = ageToMonths()
  if (am === undefined) return false
  const doses = drug.pediatricDoses || []
  if (doses.length === 0) return false
  const hasOpenEnded = doses.some(d => d.ageMaxMonths == null)
  if (hasOpenEnded) return false
  const maxAge = Math.max(...doses.map(d => d.ageMaxMonths))
  return am >= maxAge
}

// 成人量カード (年齢が小児用量範囲を超えた場合に表示)
function adultDoseCard(drug, compact=false) {
  const text = drug.adultDose && String(drug.adultDose).trim()
    ? esc(drug.adultDose)
    : '<span class="text-gray-400">成人量は登録されていません</span>'
  return `
    <div class="bg-white rounded-xl shadow-sm border-2 border-orange-300 overflow-hidden">
      <div class="bg-orange-50 border-b border-orange-200 px-4 py-2 flex items-center gap-2">
        <span class="text-sm font-semibold text-orange-700">成人量（小児用量範囲外）</span>
      </div>
      <div class="px-4 py-3">
        <div class="text-orange-900 font-bold ${compact?'text-base':'text-lg'} leading-snug">${text}</div>
        <div class="text-xs text-orange-600 mt-2 leading-relaxed">入力された年齢がこの薬剤の小児用量設定範囲を超えています。<br/>成人量を参考に、担当医の判断で投与量を決定してください。</div>
      </div>
    </div>`
}

// JPGL 2023 の Step 別用量表を、対象吸入薬 (ICS/ICS+LABA) の詳細画面に表示する
function asthmaStepSectionForDrug(drug) {
  if (!drug) return ''
  const role = JPGL_2023.drugJpglRole[drug.id]
  if (!role) return ''
  // 現在の年齢入力から Age Group を決定 (state.age + ageUnit)
  const ageRaw = parseFloat(state.age)
  let group = null
  if (Number.isFinite(ageRaw) && ageRaw >= 0) {
    const months = state.ageUnit === 'months' ? ageRaw : ageRaw * 12
    group = JPGL_2023.ageGroups.find(g => months >= g.minMonths && months <= g.maxMonths) || null
  }
  const grpLabel = group ? group.label : '年齢未入力 (両年齢群を表示)'
  const showBoth = !group
  // ICS 単剤
  const icsBox = code => {
    const range = JPGL_2023.icsDoseRanges[code]
    const example = JPGL_2023.icsRegimenExamples[code]
    if (!range || !example) return ''
    const row = (level, label, color) => `
      <div class="rounded-lg border ${color} p-2 space-y-1">
        <div class="flex items-baseline justify-between gap-2">
          <span class="text-[11px] font-bold">${label}</span>
          <span class="text-[11px] font-mono">${esc(range[level])} μg/日</span>
        </div>
        <div class="text-[11px] text-gray-800 leading-relaxed">${esc(example[level])}</div>
      </div>`
    return `<div class="space-y-2">
      ${row('low',  '低用量 (Step 1〜2 の候補)', 'border-emerald-300 bg-emerald-50')}
      ${row('mid',  '中用量 (Step 3 の候補)',   'border-amber-300 bg-amber-50')}
      ${row('high', '高用量 (Step 4 の候補)',   'border-rose-300 bg-rose-50')}
    </div>`
  }
  // ICS+LABA 用の Step ガイダンス — ステロイド (ICS) 量ベース
  const labaBox = code => {
    const range = JPGL_2023.icsLabaDoseRanges[code]
    if (!range) return ''
    const examples = JPGL_2023.regimenExamples
    const row = (level, label, color, exs) => `
      <div class="rounded-lg border ${color} p-2 space-y-1">
        <div class="flex items-baseline justify-between gap-2">
          <span class="text-[11px] font-bold">${label}</span>
          <span class="text-[11px] font-mono">${esc(range[level])}</span>
        </div>
        ${exs.filter(x => x.includes(code === 'SFC' ? 'SFC' : code === 'FFC' ? 'FFC' : code))
             .map(x => `<div class="text-[11px] text-gray-800 leading-relaxed">${esc(x)}</div>`).join('') || ''}
      </div>`
    return `<div class="space-y-2">
      <div class="text-[10px] text-gray-500 pb-1">※判断はICS(ステロイド)量。LABA量は製剤選択で自動的に決まる</div>
      ${row('low',  '低用量 (Step 3 で選択肢)', 'border-emerald-300 bg-emerald-50', examples.low)}
      ${row('mid',  '中用量 (Step 4 の主軸)',   'border-amber-300 bg-amber-50', examples.mid)}
      ${row('high', '高用量 (Step 4 追加治療)', 'border-rose-300 bg-rose-50', examples.high)}
    </div>`
  }
  let body = ''
  if (role.role === 'ICS') {
    body = icsBox(role.code)
  } else if (role.role === 'ICS/LABA') {
    body = labaBox(role.code)
  } else if (role.role === 'LABA') {
    body = `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 leading-relaxed">
      LABA 単剤は原則ICS併用が必要です。JPGL 2023 では ICS/LABA 配合剤としての使用が推奨されます (5歳以下 Step 3〜、6-15歳 Step 3〜)。
    </div>`
  } else if (role.role === 'SABA') {
    body = `<div class="bg-sky-50 border border-sky-200 rounded-lg p-3 text-xs text-sky-800 leading-relaxed">
      SABA は発作時・運動誘発予防の頓用が原則。全 Step 共通で使用可 (β2刺激薬の使用頻度がコントロール状態評価の指標)。
    </div>`
  }
  const stepLinkBtn = `<button data-goto-asthma-tool class="text-[11px] bg-sky-100 hover:bg-sky-200 text-sky-700 font-medium px-2 py-1 rounded">🎯 Step判別ツールを開く</button>`
  return `
    <div class="bg-white rounded-xl shadow-sm border-2 border-sky-300 overflow-hidden mb-3">
      <div class="bg-sky-50 border-b border-sky-200 px-4 py-2 flex items-center justify-between gap-2">
        <div>
          <div class="text-sm font-bold text-sky-900">🎯 JPGL 2023 治療ステップ別 用量ガイド</div>
          <div class="text-[11px] text-sky-700 mt-0.5">${esc(role.role)} / 対象: ${esc(grpLabel)}${showBoth?' — 5歳以下/6〜15歳共通の目安表':''}</div>
        </div>
        ${stepLinkBtn}
      </div>
      <div class="px-3 py-3">${body}</div>
    </div>`
}

// 用量カード一覧の HTML を返す共通ヘルパー。
//   年齢が小児用量範囲を超えていれば成人量カード、そうでなければ通常の小児用量カードを並べる。
function dosesHTML(drug, weight, compact=false) {
  if (isAgeOverPediatric(drug)) return adultDoseCard(drug, compact)
  if (isAgeUnderPediatric(drug)) {
    return `
      <div class="bg-white rounded-xl shadow-sm border-2 border-gray-200 overflow-hidden">
        <div class="bg-gray-50 border-b border-gray-200 px-4 py-2">
          <span class="text-sm font-semibold text-gray-700">適応外（最小年齢未満）</span>
        </div>
        <div class="px-4 py-3">
          <div class="text-gray-500 text-xs leading-relaxed">入力された年齢がこの薬剤の小児用量設定の最小年齢を下回っています。<br/>必要に応じて担当医の判断で投与量を決定してください。</div>
        </div>
      </div>`
  }
  const matched = filteredDoses(drug)
  if (matched.length === 0) {
    const w = parseFloat(state.weight)
    const hasW = isFinite(w) && w > 0
    const am = ageToMonths()
    const reasons = []
    if (am !== undefined) reasons.push('年齢')
    if (hasW) reasons.push('体重')
    const reason = reasons.length > 0 ? `この${reasons.join('・')}` : '入力条件'
    return `
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 text-center text-xs text-gray-500">
        ${reason}に該当する用量設定がありません
      </div>`
  }
  return matched.map(d => doseCard(d, weight, compact, drug)).join('')
}

// ── リスト画面 ────────────────────────────────────────────

// 投与経路文字列をカラーバッジ HTML に変換する。
//   freeform string ('内服', '点滴静注', '内服・坐剤', etc.) を「・」で分割し、
//   各経路をキーワード判定して色付きの小さなバッジで返す。
function routeBadge(route) {
  if (!route) return ''
  const parts = String(route).split(/[・,、\/]/).map(s => s.trim()).filter(Boolean)
  return parts.map(p => {
    let color, label = p
    if (/点滴|静注|筋注|皮下注|注射/.test(p)) {
      color = 'bg-purple-100 text-purple-700'
      // 短縮表示
      if (p === '点滴静注') label = '点滴'
    } else if (/吸入/.test(p)) color = 'bg-cyan-100 text-cyan-700'
    else if (/坐剤|坐薬|座薬/.test(p)) { color = 'bg-orange-100 text-orange-700'; label = '坐剤' }
    else if (/外用|塗布|貼付|貼/.test(p)) color = 'bg-green-100 text-green-700'
    else if (/点眼|点鼻|点耳/.test(p)) color = 'bg-teal-100 text-teal-700'
    else if (/内服/.test(p)) color = 'bg-blue-100 text-blue-700'
    else color = 'bg-gray-100 text-gray-700'
    return `<span class="text-[10px] px-1.5 py-0.5 rounded font-medium leading-none ${color} shrink-0">${esc(label)}</span>`
  }).join('')
}

// 製剤文字列または { text, ageMinMonths, ageMaxMonths, weightMinKg, weightMaxKg, notes } 形式を
// 共通の object に正規化する。
function normalizeFormulation(f) {
  if (typeof f === 'string') return { text: f }
  if (f && typeof f === 'object' && typeof f.text === 'string') return { ...f }
  return null
}

// 制約 object → 表示用テキスト (例: "≥6歳", "≥10kg, <40kg", "<3ヶ月禁忌")
function formulationConstraintText(form) {
  if (!form) return ''
  const parts = []
  const fmtAge = m => {
    if (m === 0) return '0ヶ月'
    if (m < 12) return `${m}ヶ月`
    if (m % 12 === 0) return `${m/12}歳`
    return `${m}ヶ月`
  }
  if (form.ageMinMonths != null && form.ageMaxMonths != null) {
    parts.push(`${fmtAge(form.ageMinMonths)}〜${fmtAge(form.ageMaxMonths)}未満`)
  } else if (form.ageMinMonths != null) {
    parts.push(`${fmtAge(form.ageMinMonths)}以上`)
  } else if (form.ageMaxMonths != null) {
    parts.push(`${fmtAge(form.ageMaxMonths)}未満`)
  }
  if (form.weightMinKg != null && form.weightMaxKg != null) {
    parts.push(`${form.weightMinKg}〜${form.weightMaxKg}kg未満`)
  } else if (form.weightMinKg != null) {
    parts.push(`${form.weightMinKg}kg以上`)
  } else if (form.weightMaxKg != null) {
    parts.push(`${form.weightMaxKg}kg未満`)
  }
  if (form.notes) parts.push(form.notes)
  return parts.join(' / ')
}

// 全 formulations を表示用テキスト (制約付き) に変換 (info 行用)
function formulationDisplay(forms) {
  if (!Array.isArray(forms)) return ''
  return forms.map(f => {
    const n = normalizeFormulation(f)
    if (!n) return ''
    const c = formulationConstraintText(n)
    return c ? `${n.text} [${c}]` : n.text
  }).filter(Boolean).join('、')
}

// 患者の年齢 (月数) と体重 (kg) で formulation が使用可能か判定する。
// 患者値が未入力でも、dose の年齢/体重範囲があればそれを使って範囲オーバーラップ判定する。
function isFormulationAllowed(form, am, w, dose) {
  if (!form) return false
  // 年齢: 患者の年齢が入力されていればそれで判定。未入力なら dose の年齢範囲と重なるかチェック
  if (am !== undefined) {
    if (form.ageMinMonths != null && am < form.ageMinMonths) return false
    if (form.ageMaxMonths != null && am >= form.ageMaxMonths) return false
  } else if (dose) {
    // form が必要とする最小年齢が dose の最大年齢以上 → 範囲が交わらないので除外
    if (dose.ageMaxMonths != null && form.ageMinMonths != null && form.ageMinMonths >= dose.ageMaxMonths) return false
    // form の最大年齢が dose の最小年齢以下 → 同上
    if (dose.ageMinMonths != null && form.ageMaxMonths != null && form.ageMaxMonths <= dose.ageMinMonths) return false
  }
  // 体重: 同様
  if (isFinite(w) && w > 0) {
    if (form.weightMinKg != null && w < form.weightMinKg) return false
    if (form.weightMaxKg != null && w >= form.weightMaxKg) return false
  } else if (dose) {
    if (dose.weightMaxKg != null && form.weightMinKg != null && form.weightMinKg >= dose.weightMaxKg) return false
    if (dose.weightMinKg != null && form.weightMaxKg != null && form.weightMaxKg <= dose.weightMinKg) return false
  }
  return true
}

// サブカテゴリで items をグループ化して見出し付き <ul> 文字列を返す。
// item ごとに renderItem(item) が呼ばれ、<li> を返すこと。
// グループ分けが不要 (全アイテムにサブカテゴリが無い) 場合は単純なリストを返す。
function renderListBySubcategory(items, renderItem) {
  if (!items || items.length === 0) return ''
  const hasAnySub = items.some(i => i && typeof i.subcategory === 'string' && i.subcategory.trim() !== '')
  if (!hasAnySub) return items.map(renderItem).join('')
  // ── 1階層目: サブカテゴリでグループ化 ────────────────────────
  const subOrder = []
  const subGroups = new Map()
  for (const i of items) {
    const sub = (i && typeof i.subcategory === 'string') ? i.subcategory.trim() : ''
    const key = sub || '__other__'
    if (!subGroups.has(key)) { subGroups.set(key, []); subOrder.push(key) }
    subGroups.get(key).push(i)
  }
  // 明示的なサブカテゴリ順序を優先
  const explicit = (SUBCATEGORY_ORDER && state.category && SUBCATEGORY_ORDER[state.category]) || []
  let ordered
  if (Array.isArray(explicit) && explicit.length > 0) {
    const existingSubs = new Set(subOrder)
    const explicitFiltered = explicit.filter(k => existingSubs.has(k))
    const explicitSet = new Set(explicitFiltered)
    const rest = subOrder.filter(k => !explicitSet.has(k) && k !== '__other__')
    ordered = [...explicitFiltered, ...rest]
    if (subOrder.includes('__other__')) ordered.push('__other__')
  } else {
    ordered = subOrder.filter(k => k !== '__other__').concat(subOrder.includes('__other__') ? ['__other__'] : [])
  }
  // ── 2階層目: サブサブカテゴリでさらにグループ化（存在する場合のみ） ──
  return ordered.map(subKey => {
    const list = subGroups.get(subKey)
    const subLabel = subKey === '__other__' ? 'その他' : subKey
    const subHeader = `<li class="px-4 py-1.5 text-[11px] font-semibold text-gray-500 bg-gray-50 border-b border-gray-100 sticky top-0">${esc(subLabel)} <span class="text-gray-400 font-normal">(${list.length})</span></li>`
    const hasAnySubSub = list.some(i => i && typeof i.subsubcategory === 'string' && i.subsubcategory.trim() !== '')
    if (!hasAnySubSub) {
      return subHeader + list.map(renderItem).join('')
    }
    const ssOrder = []
    const ssGroups = new Map()
    for (const i of list) {
      const ss = (i && typeof i.subsubcategory === 'string') ? i.subsubcategory.trim() : ''
      const ssKey = ss || '__other__'
      if (!ssGroups.has(ssKey)) { ssGroups.set(ssKey, []); ssOrder.push(ssKey) }
      ssGroups.get(ssKey).push(i)
    }
    // 明示的なサブサブカテゴリ順序を優先
    const ssExplicit = (SUBSUBCATEGORY_ORDER && state.category && SUBSUBCATEGORY_ORDER[state.category] && SUBSUBCATEGORY_ORDER[state.category][subKey]) || []
    let ssOrdered
    if (Array.isArray(ssExplicit) && ssExplicit.length > 0) {
      const existingSet = new Set(ssOrder)
      const explicitFiltered = ssExplicit.filter(k => existingSet.has(k))
      const explicitSet2 = new Set(explicitFiltered)
      const rest = ssOrder.filter(k => !explicitSet2.has(k) && k !== '__other__')
      ssOrdered = [...explicitFiltered, ...rest]
      if (ssOrder.includes('__other__')) ssOrdered.push('__other__')
    } else {
      ssOrdered = ssOrder.filter(k => k !== '__other__').concat(ssOrder.includes('__other__') ? ['__other__'] : [])
    }
    return subHeader + ssOrdered.map(ssKey => {
      const ssList = ssGroups.get(ssKey)
      const ssLabel = ssKey === '__other__' ? '—' : ssKey
      // インデント + 小さめのフォントで 3 階層目を表現
      const ssHeader = `<li class="pl-8 pr-4 py-1 text-[10px] font-medium text-gray-400 bg-gray-50/60 border-b border-gray-100">${esc(ssLabel)} <span class="text-gray-300">(${ssList.length})</span></li>`
      return ssHeader + ssList.map(renderItem).join('')
    }).join('')
  }).join('')
}

function calcHolidaySegar(weight) {
  if (!weight || weight <= 0) return null
  const w = parseFloat(weight)
  if (isNaN(w) || w <= 0) return null
  let daily
  if (w <= 10) { daily = w * 100 }
  else if (w <= 20) { daily = 1000 + (w - 10) * 50 }
  else { daily = 1500 + (w - 20) * 20 }
  const hourly = daily / 24
  return {
    daily: Math.round(daily),
    hourly: Math.round(hourly * 10) / 10,
  }
}

function calcGIR(glc, rate, weight) {
  const g = parseFloat(glc), r = parseFloat(rate), w = parseFloat(weight)
  if (!g || !r || !w || g<=0 || r<=0 || w<=0) return null
  return Math.round(g * 10 * r / (w * 60) * 100) / 100
}
function calcGIRRate(gir, glc, weight) {
  const t = parseFloat(gir), g = parseFloat(glc), w = parseFloat(weight)
  if (!t || !g || !w || t<=0 || g<=0 || w<=0) return null
  return Math.round(t * w * 60 / (g * 10) * 10) / 10
}

// 薬剤量 (mg), 溶解液量 (mL), γ (μg/kg/min), 体重 (kg) → 注入速度 (mL/hr)
function calcMlhFromGamma(drug, fluid, gamma, weight) {
  const d = parseFloat(drug), f = parseFloat(fluid), g = parseFloat(gamma), w = parseFloat(weight)
  if (!d || !f || !g || !w || d<=0 || f<=0 || g<=0 || w<=0) return null
  return Math.round((g * w * 60 * f) / (d * 1000) * 100) / 100
}
// 薬剤量 (mg), 溶解液量 (mL), 注入速度 (mL/hr), 体重 (kg) → γ (μg/kg/min)
function calcGammaFromMlh(drug, fluid, rate, weight) {
  const d = parseFloat(drug), f = parseFloat(fluid), r = parseFloat(rate), w = parseFloat(weight)
  if (!d || !f || !r || !w || d<=0 || f<=0 || r<=0 || w<=0) return null
  return Math.round((d * r * 1000) / (f * w * 60) * 100) / 100
}

        <div class="flex items-center border-b border-gray-100 px-4 py-3 gap-2">
